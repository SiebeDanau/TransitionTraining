<!DOCTYPE html>
<html>
<head>
  <title>Transition Training</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="js/index.js?v=20260920-1" defer></script>
  <style>
    body {
      max-width: 920px;
      margin: 0 auto;
      padding: 32px 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
      background: #f5f4ef;
    }

    #menu {
      display: grid;
      gap: 16px;
    }

    .module-card {
      display: grid;
      gap: 14px;
      padding: 20px;
      border: 1px solid #d8d5cc;
      border-radius: 10px;
      background: #fff;
    }

    .module-card h2,
    .module-card p {
      margin: 0;
    }

    .module-actions {
      display: flex;
      align-items: end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .role-field {
      display: grid;
      gap: 6px;
      min-width: 220px;
    }

    select,
    button {
      min-height: 42px;
      padding: 0 12px;
      font: inherit;
      border-radius: 8px;
    }

    select {
      border: 1px solid #aaa;
      background: #fff;
    }

    button {
      border: 1px solid #186c78;
      background: #186c78;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: .5;
    }

    #menuStatus {
      color: #b3261e;
    }

    .object-dropdown { position: relative; }
    .object-dropdown summary {
      box-sizing: border-box;
      min-height: 42px;
      padding: 11px 12px;
      border: 1px solid #aaa;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }
    .object-options {
      position: absolute;
      z-index: 2;
      top: calc(100% + 4px);
      left: 0;
      min-width: 100%;
      max-height: 280px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #aaa;
      border-radius: 8px;
      box-shadow: 0 4px 12px #0002;
    }
    .object-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .object-options label:first-child {
      position: sticky;
      top: 0;
      background: #fff;
      border-bottom: 1px solid #ddd;
      font-weight: bold;
    }
    .object-options label:hover { background: #f5f4ef; }
  </style>
</head>
<body>

  <h1>Training Modules</h1>

  <div id="menu"></div>
  <p id="menuStatus" role="alert"></p>

</body>
</html>
