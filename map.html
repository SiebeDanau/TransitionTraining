<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaarttrainer</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f4ef;
        --panel: #ffffff;
        --ink: #202124;
        --muted: #5f6368;
        --line: #d8d5cc;
        --accent: #186c78;
        --good: #167847;
        --bad: #b3261e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
      }

      .sidebar {
        border-right: 1px solid var(--line);
        background: var(--panel);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .title {
        margin: 0;
        font-size: 28px;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .back {
        display: inline-block;
        margin-bottom: 10px;
        color: var(--accent);
        text-decoration: none;
      }

      .back:hover,
      .back:focus-visible {
        text-decoration: underline;
      }

      .intro,
      .hint {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
      }

      .status {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        background: #fbfaf7;
      }

      .label {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .prompt {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.15;
      }

      .feedback {
        min-height: 26px;
        margin: 0;
        font-weight: 700;
        line-height: 1.35;
      }

      .feedback.good {
        color: var(--good);
      }
      .feedback.bad {
        color: var(--bad);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .button {
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        min-height: 42px;
        padding: 0 14px;
        cursor: pointer;
      }

      .button.secondary {
        background: #ffffff;
        color: var(--accent);
      }

      .button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: #fbfaf7;
      }

      .stat strong {
        display: block;
        font-size: 24px;
        line-height: 1;
      }

      .stat span {
        color: var(--muted);
        font-size: 12px;
      }

      .main {
        min-width: 0;
        padding: 24px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 16px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .select {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: var(--ink);
        padding: 0 12px;
      }

      .map-shell {
        min-height: 360px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: #ffffff;
      }

      .map-canvas {
        width: 100%;
        height: 100%;
        min-height: 520px;
      }

      .background-control {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .map-note {
        color: var(--muted);
        font-size: 13px;
      }

      .map-legend {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 13px;
      }

      .map-legend-line {
        width: 30px;
        height: 0;
        border-top: 4px solid #000000;
      }

      .map-legend-line.tma {
        border-top-color: #2563eb;
      }

      .maplibregl-ctrl-group {
        border: 1px solid var(--line);
        box-shadow: none;
      }

      .map-error {
        height: 100%;
        min-height: 520px;
        display: grid;
        place-items: center;
        padding: 32px;
        color: var(--bad);
        text-align: center;
      }

      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .main {
          padding: 16px;
        }
        .map-canvas,
        .map-error {
          min-height: 460px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="sidebar" aria-label="Quiz">
        <div>
          <a href="index.html" class="back">← Modules</a>
          <h1 class="title" id="pageTitle">Kaarttrainer</h1>
          <p class="intro" id="pageIntro">
            Klik op de gevraagde punten.
          </p>
        </div>

        <div class="status" aria-live="polite">
          <p class="label">Duid aan</p>
          <p class="prompt" id="prompt"></p>
        </div>

        <p class="feedback" id="feedback"></p>

        <div class="controls">
          <button class="button" id="nextButton" type="button" disabled>
            Volgende
          </button>
          <button
            class="button secondary"
            id="revealButton"
            type="button"
            disabled
          >
            Toon antwoord
          </button>

        <div class="stats" aria-label="Score">
          <div class="stat">
            <strong id="correctCount">0</strong><span>juist</span>
          </div>
          <div class="stat">
            <strong id="wrongCount">0</strong><span>fout</span>
          </div>
          <div class="stat">
            <strong id="streakCount">0</strong><span>reeks</span>
          </div>
          <div class="stat">
            <strong id="progressCount">0 / 0</strong><span>voortgang</span>
          </div>
        </div>

        <div class="controls">
          <button
            class="button secondary"
            id="resetButton"
            type="button"
            disabled
          >
            Herlaad alle punten
          </button>
          <button
            class="button secondary"
            id="retryButton"
            type="button"
            style="display:none"
          >
            Herlaad foute antwoorden
          </button>
        </div>
      </section>

      <section class="main" aria-label="Kaart">
        <div class="toolbar">
          <label class="background-control" for="backgroundMode">
            <span>Achtergrond</span>
            <select class="select" id="backgroundMode">
              <option value="local">Rustige trainingskaart</option>
              <option value="osm" selected>OpenStreetMap minimaal</option>
            </select>
          </label>
          <span class="map-note" id="mapNote">
            Wegen en overige details zijn verborgen.
          </span>
          <span class="map-legend">
            <span class="map-legend-line" aria-hidden="true"></span>
            Brussels UIR
          </span>
          <span class="map-legend">
            <span class="map-legend-line tma" aria-hidden="true"></span>
            TMA
          </span>
        </div>

        <div class="map-shell">
          <div class="map-canvas" id="mapCanvas" aria-label="Interactieve trainingskaart"></div>
        </div>
      </section>
    </main>
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script type="module" src="js/map-quiz-controller.js?v=20260731-5"></script>
  </body>
</html>
